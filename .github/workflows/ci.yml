name: SwingDeck CI & Architecture Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Architecture & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Syntax and lint check (flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,.git,__pycache__,scratch,build,dist
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics --exclude=.venv,.git,__pycache__,scratch,build,dist

      - name: Run Architecture Enforcement Gate
        run: |
          pytest tests/test_00_architecture_enforcement.py -v

      - name: Run Core Agent & Integration Tests
        run: |
          pytest tests/test_agent2_semi_manual_news.py tests/test_incident_center.py tests/test_control_plane.py -v
